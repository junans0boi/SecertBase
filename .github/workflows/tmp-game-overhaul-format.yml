# 임시 워크플로(feat/game-overhaul 전용): 작성 환경에 Dart SDK가 없어 dart format을
# CI에서 적용하고, analyze/test 결과를 확인한다. 확인 후 삭제한다.
name: TMP game-overhaul format

on:
  push:
    branches:
      - feat/game-overhaul

permissions:
  contents: write

jobs:
  format-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/game-overhaul
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
      - name: Install dependencies
        working-directory: apps/secret_base_app
        run: flutter pub get
      - name: Apply dart format
        working-directory: apps/secret_base_app
        run: dart format .
      - name: Commit formatting
        run: |
          if [ -n "$(git status --porcelain apps/secret_base_app)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/secret_base_app
            git commit -m "style(app): dart format"
            git push origin HEAD:feat/game-overhaul
          fi
      - name: Regenerate yut board golden on the CI renderer
        working-directory: apps/secret_base_app
        run: flutter test --update-goldens test/yut_board_layout_test.dart
      - name: Commit golden
        run: |
          if [ -n "$(git status --porcelain apps/secret_base_app/test)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/secret_base_app/test
            git commit -m "test(app): regenerate yut board golden on the CI renderer"
            git push origin HEAD:feat/game-overhaul
          fi
      - name: Analyze code
        working-directory: apps/secret_base_app
        continue-on-error: true
        run: flutter analyze
      - name: Run tests
        working-directory: apps/secret_base_app
        continue-on-error: true
        run: flutter test
